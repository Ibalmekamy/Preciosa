 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <style>
    :root {
      --bg-color: #121212;
      --primary-accent: #A62639;
      --secondary-accent: #7D98B3;
      --text-color: #F5F5F0;
      --hover-color: #E8B059;
    }

    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 2rem 1rem;
      line-height: 2; /* Increased for better readability with inline inputs */
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      letter-spacing: 1.5px;
      text-align: center;
    }

    .divider {
      width: 60%;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--primary-accent), transparent);
      margin: 0.8rem auto 2.5rem;
    }

    form {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .sentence-group {
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    input[type="text"] {
      border: none;
      border-bottom: 1.5px solid var(--secondary-accent);
      background: transparent;
      color: var(--hover-color);
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      padding: 0 5px;
      text-align: center;
      transition: border-color 0.3s;
      display: inline-block; /* Essential for "fill in the blank" look */
    }

    /* Adjusted widths to keep them small and tight */
    input[name="username"] { width: 180px; margin-top: 10px; }
    input[name="blank1"] { width: 70px; }
    input[name="blank2"] { width: 60px; }
    input[name="blank3"] { width: 80px; }
    input[name="blank4"] { width: 80px; }

    input[type="text"]:focus {
      outline: none;
      border-bottom: 2px solid var(--hover-color);
    }

    .next-btn {
      background-color: var(--primary-accent);
      color: var(--text-color);
      border: none;
      padding: 0.6rem 2.5rem;
      font-size: 1rem;
      font-family: 'Georgia', serif;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <h1>Sign Up</h1>
  <div class="divider"></div>

  <form>
    <div class="sentence-group">
      May I have your username, please?<br>
      <input type="text" name="username" placeholder="username" />
    </div>

    <div class="sentence-group">
      I'm always a <input type="text" name="blank1" placeholder="..." /> in front of you.
    </div>

    <div class="sentence-group">
      My transistor <input type="text" name="blank2" placeholder="..." /> comes from far away. 
      And when it's night over here, over there it's <input type="text" name="blank3" placeholder="..." /> day.
      She cried when she said she'd been promised to <input type="text" name="blank4" placeholder="..." /> man.
    </div>

    <button type="button" class="next-btn" id="nextBtn">Next</button>
  </form>

  <script>
    document.getElementById("nextBtn").addEventListener("click", function() {
      const answers = {
        username: document.getElementsByName("username")[0].value.trim().toLowerCase(),
        blank1: document.getElementsByName("blank1")[0].value.trim().toLowerCase(),
        blank2: document.getElementsByName("blank2")[0].value.trim().toLowerCase(),
        blank3: document.getElementsByName("blank3")[0].value.trim().toLowerCase(),
        blank4: document.getElementsByName("blank4")[0].value.trim().toLowerCase()
      };

      if (
        answers.username === "prettiest girl ive ever seen" &&
        answers.blank1 === "looser" &&
        answers.blank2 === "radio" &&
        answers.blank3 === "breakin'" &&
        answers.blank4 === "another"
      ) {
        window.location.href = "main.html";
      } else {
        alert("Some answers are incorrect. Please try again.");
      }
    });
  </script>
</body>
</html>
